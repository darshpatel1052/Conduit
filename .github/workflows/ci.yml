name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant. Cancelling it
# frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go — vet, race tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The unit suite uses miniredis rather than a Redis service, so it needs no
    # containers here. The store-backed product story runs in the job below,
    # keeping this one fast enough to be useful on every push.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          # gofmt -l prints files that need formatting and exits 0 either way,
          # so the emptiness of its output is the assertion.
          unformatted=$(gofmt -l $(find internal scripts/load/mockprovider -type f -name '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./internal/... ./scripts/load/mockprovider/...

      - name: Tests with the race detector
        # -race is the point of running tests in CI at all for this codebase:
        # the gateway's whole job is concurrent, and the interesting bugs
        # (atomic routing-table swaps, breaker callbacks, stream cancellation)
        # are the ones a single-threaded test run cannot see.
        run: go test ./internal/... ./scripts/load/mockprovider/... -race -count=1

      - name: Build
        run: go build -buildvcs=false -trimpath -ldflags "-s -w" -o /tmp/mockprovider ./scripts/load/mockprovider

      - name: Binary starts
        run: /tmp/mockprovider -h >/dev/null

  web:
    name: Dashboard — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # ci, not install: fails if package.json and the lockfile have drifted,
        # rather than silently resolving a different tree than was tested.
        run: npm ci

      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  services:
    name: Product story — real stores and deterministic providers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The integration gate runs what a new user runs. It verifies behavior
    # through the control and inference APIs, then checks the backing stores
    # directly so a self-reported gateway status cannot create a false pass.
    steps:
      - uses: actions/checkout@v5

      - name: Start the complete stack
        run: docker compose up --build -d

      - name: Wait for safe readiness
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null && exit 0
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Run the project-scoped gateway story
        run: make demo

      - name: Assert credentials are ciphertext in PostgreSQL
        run: |
          encrypted=$(docker compose exec -T postgres psql -U conduit -d conduit -Atc \
            "SELECT count(*) FROM provider_connections WHERE encrypted_credential IS NOT NULL")
          test "$encrypted" -gt 0
          leaked=$(docker compose exec -T postgres psql -U conduit -d conduit -Atc \
            "SELECT count(*) FROM provider_connections WHERE encode(encrypted_credential,'escape') LIKE '%demo-rotated-secret%'")
          test "$leaked" -eq 0

      - name: Assert analytics reached ClickHouse
        run: |
          for _ in $(seq 1 20); do
            events=$(docker compose exec -T clickhouse clickhouse-client \
              --user conduit --password conduit --database conduit \
              --query 'SELECT count() FROM conduit_requests')
            test "$events" -gt 0 && exit 0
            sleep 1
          done
          exit 1

      - name: Service state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 gateway postgres redis clickhouse mock-provider dashboard

  image:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only worth building once the code that goes in them is known good.
    needs: [go, web]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: conduit:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs and is the version we built
        run: |
          version=$(docker run --rm conduit:${{ github.sha }} -version)
          echo "$version"
          echo "$version" | grep -q "${{ github.sha }}"

      - name: Build the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: conduit-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
